<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--form tag topic: to define the structure for a registration-->
    <h3>Enter the user details</h3>
    <form action="">
        <label for="firstname">Enter first name</label>
        <input type="text" name="first-name" id="firstname" placeholder="enter first name"><br>

        <label for="lastname" id="name">Enter last name</label>
        <input type="text" name="last-name" id="lastname" placeholder="enter last name"><br>

        <label for="email">Enter your email</label>
        <input type="email" name="email" id="email" placeholder="abc@gmail.com"><br>

        <label for="">Date of Birth</label>
        <input type="date"><br>

        <label for="">gender: </label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">male</label>
        <!--name and value is use to select only one  if both names are same but values are different so only one can select-->
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">female</label><br>


        <label for="password">Create a new password</label>
        <input type="password" name="password" id="password" placeholder="enter password"><br>

        <label for="">choose skills: </label>

        <input type="checkbox" id="python">
        <label for="python">python</label>

        <input type="checkbox" id="java">
        <label for="java">java</label>

        <input type="checkbox" id="php">
        <label for="php">php</label>

        <input type="checkbox" id="c++">
        <label for="c++">c++</label>

        <input type="checkbox" id="c">
        <label for="c">c</label>
        <br>
        <br>
        <button type="submit">submit form</button>
        <button type="reset"> reset form</button>

        <!--
 attribute
 ------------
 'for'- 'id' to make relation
 'name'(object key ) relation to 'value'   
 'placeholder' tag is used to display text inside text box at input
'required' is used to make mandatory filed used in input tag
-->

    </form>
</body>

</html>
