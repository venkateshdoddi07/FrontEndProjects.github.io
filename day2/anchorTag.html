<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anchor tag main</title>
</head>

<body>
    <!-- <a></a>
     anchor tag represent as above -->
    <!--self target is page redirect inthe existing tab only-->
    <h3>open wikipedia page</h3>
    <a href="https://www.wikipedia.org/" target="_self">wikipedia</a>

    <!--self target is page redirect inthe new tab -->
    <a href="https://www.wikipedia.org/" target="_blank">wiki</a>


    <h3>courses</h3>
    <!--redirecting locally-->
    <a href="courses.html" target="_blank">open courses</a>
    <h3>open tech</h3>

    <!--tech.html redirecting-->
    <a href="tech.html" target="_blank">tech</a>

    <h3>registration link</h3>
    <!--registration form-->
    <a href="register.html" target="_blank">open registration form</a>



    <!--redirecting to email-->
    <!--here we need to integrate for email and phone number to their respective mail or call fields-->
    <h3>email redirect part</h3>
    <a href="mailto:venkateshstrives@gmail.com">mail us</a>

    <h3>contact redirect part</h3>
    <a href="tel:8499959871">call us</a>

    <h3>whatsapp redirect part</h3>
    <a href="https://wa.me/8499959871" target="_blank">whatsappme</a>


</body>

</html>
