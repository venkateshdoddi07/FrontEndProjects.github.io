<!DOCTYPE html>
<html lang="en">

<head>
    <title>Courses page</title>
    <h1>course data</h1>
</head>

<body>

    table tag--- to define table
    tr tag ---- to define a row
    td tag--to define a cell table data
    -->
    <table border="2" width="700px" cellpadding="10" cellspacing="9">
        <tr align="center">
            <th>group</th>
            <th>courses names</th>
            <th>fees</th>
        </tr>
        <tr align="center">
            <td>4-7th</td>
            <td>maths,science</td>
            <td>5000</td>
        </tr>
        <tr align="center">
            <td>6-10th</td>
            <td>maths,chemistry</td>
            <td>8000</td>
        </tr>


    </table>

</body>

</html>
